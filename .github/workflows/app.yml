name: Build and Release

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Build a debug APK instead of a signed release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        type: boolean
        required: false
        default: false
      publish:
        description: 'Publish a GitHub release after a successful release build'
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}

    outputs:
      versionName: ${{ steps.buildWithGradle.outputs.versionName }}
      artifactName: ${{ steps.buildWithGradle.outputs.artifactName }}
      filePath: ${{ steps.buildWithGradle.outputs.filePath }}
      sha256: ${{ steps.buildWithGradle.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.0"

      - name: Validate signing config
        run: |
          if [ "${{ inputs.debug }}" != "true" ] && [ -z "$KEYSTORE" ]; then
            echo "::error::KEYSTORE secret is not configured. A signing key is required for release builds."
            exit 1
          fi

      - name: Create signing.properties
        if: ${{ inputs.debug != true && env.KEYSTORE != '' }}
        run: |
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
          echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
          echo KEYSTORE_ALIAS_PASSWORD=${{ secrets.KEYSTORE_ALIAS_PASSWORD }} >> signing.properties
          echo KEYSTORE_FILE=../key.jks >> signing.properties
          printf '%s' "$KEYSTORE" | base64 --decode > key.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        id: buildWithGradle
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            CMD="./gradlew :manager:assembleDebug"
            APK_DIR="manager/build/outputs/apk/debug"
          else
            CMD="./gradlew :manager:assembleRelease"
            APK_DIR="manager/build/outputs/apk/release"
          fi

          [ "${{ inputs.prerelease }}" = "true" ] && CMD="$CMD -Pbeta"

          eval $CMD
          FILE=$(ls "$APK_DIR"/*.apk | head -n 1)
          VERSION=$(basename "$FILE" | sed -E 's/^shizuku-v?(.*)-(debug|release)\.apk$/\1/')

          ARTIFACT_NAME="Shizuku-Nightzuku-$VERSION"
          [ "${{ inputs.debug }}" = "true" ] && ARTIFACT_NAME="${ARTIFACT_NAME}-debug"
          ARTIFACT_NAME="${ARTIFACT_NAME}.apk"

          RENAMED="$(dirname "$FILE")/$ARTIFACT_NAME"
          if [ "$FILE" != "$RENAMED" ]; then
            mv "$FILE" "$RENAMED"
          fi

          SHA256=$(sha256sum "$RENAMED" | cut -d' ' -f1)

          echo "versionName=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifactName=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "filePath=$RENAMED" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.buildWithGradle.outputs.artifactName }}
          path: ${{ steps.buildWithGradle.outputs.filePath }}

      - name: Attest build provenance
        if: ${{ success() && inputs.debug != true }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.buildWithGradle.outputs.filePath }}

  release:
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.debug != true && (github.event_name == 'push' || inputs.publish != false) }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifactName }}
          path: files

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.versionName }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifactName }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi

          FLAGS="--title Shizuku-Nightzuku-${VERSION}"
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="$FLAGS --prerelease"
          else
            FLAGS="$FLAGS --latest"
          fi

          NOTES="Signed release APK built from \`${GITHUB_SHA}\` by GitHub Actions.\n\nSHA-256: \`${SHA256}\`"
          gh release create "$TAG" "files/${ARTIFACT_NAME}" --notes "$NOTES" $FLAGS
